</style></head>
<body><div id="site"></div><button id="eb" class="btn" hidden>Edit page</button><aside id="dr" aria-label="Page editor"></aside>
<script src="config.js"></script>
<script id="app">
const S=window.PORTFOLIO;
const TY=["AI Drama","AI UGC","VSL","Podcast","AI Song","Animations"];
const G=[["#4a3df0","#c66bff"],["#2b2d42","#b5173b"],["#0f2027","#2c5364"],["#ff7a59","#8a2be2"],["#12a37f","#0b4d6b"],["#d4a017","#7a4b00"]];
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const em=t=>esc(t).replace(/\*(.+?)\*/g,"<em>$1</em>");
let cur="All",shown=8,art=null,assets=null,dirty=false;
function site(){
const P=S.p,cats=["All",...TY.filter(t=>S.w.some(w=>w.t==t))];
const list=S.w.filter(w=>cur=="All"||w.t==cur);
const tick=TY.concat(TY).concat(TY).concat(TY).map(t=>`<span>${t} ✦</span>`).join("");
const rows=[["Email",P.email,P.email&&"mailto:"+P.email],["WhatsApp",P.whatsapp&&"Message me",P.whatsapp],["Discord",P.discord,""],["All videos",P.folder&&"Open folder",P.folder]].filter(r=>r[1]);
document.title=P.name+" · "+P.role;document.body.dataset.t=S.theme||"pop";
$("#site").innerHTML=`<header><div class="w"><a class="logo" href="#top"><b>${esc(P.name.split(" ").map(x=>x[0]).join("").slice(0,2))}</b><span>${esc(P.name)}<small>${esc(P.role)}</small></span></a>
<nav><a href="#about">About</a><a href="#work">Work</a><a href="#spec">Specializations</a><a href="#tools">Tools</a><a href="#process">Process</a></nav><a class="btn" href="#contact">Work with me</a></div></header>
<main id="top"><div class="w hero"><span class="st"><i></i>${esc(P.status||"Available for freelance projects and full-time roles")}</span>
<h1>${em(P.headline)}</h1><p class="role">${esc(P.name)} · ${esc(P.role)}</p><p class="lead">${esc(P.intro)}</p>
<div class="cta"><a class="btn" href="#work">Watch my work</a>${P.email?`<a class="btn o" href="mailto:${esc(P.email)}">Email me</a>`:""}${P.folder?`<a class="btn o" target="_blank" rel="noopener" href="${esc(P.folder)}">Full portfolio ↗</a>`:""}</div>
<div class="strip"><div><span>01</span>Script</div><div><span>02</span>Generate</div><div><span>03</span>Edit</div><div><span>04</span>Iterate</div></div>
${S.s.some(s=>s[0])?`<div class="stats">${S.s.filter(s=>s[0]).map(s=>`<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`:""}</div>
<div class="mq" aria-hidden="true"><div>${tick}</div></div>
<section id="about"><div class="w"><div class="k">( 01 ) About</div><div class="ab">${S.photo?`<img class="ph" src="${esc(S.photo)}" alt="${esc(P.name)}">`:"<div></div>"}<div>
<h2>Real person. <em>AI-powered</em> output.</h2><p class="lead">${esc(P.about)}</p>
<dl><div><dt>Formats</dt><dd>AI UGC, VSLs, cinematic drama, podcast, song and animated ads</dd></div><div><dt>Industries</dt><dd>E-commerce, beauty, fashion, health &amp; wellness</dd></div><div><dt>Platforms</dt><dd>Meta, TikTok, YouTube Shorts</dd></div>${P.location?`<div><dt>Based in</dt><dd>${esc(P.location)}</dd></div>`:""}</dl></div></div></div></section>
<section id="work"><div class="w"><div class="k">( 02 ) Selected work</div><h2>Real ads. Ready to <em>watch.</em></h2>
<div class="chips">${cats.map(c=>`<button class="chip" aria-pressed="${c==cur}" data-c="${c}">${c}</button>`).join("")}</div>
<div class="grid">${list.slice(0,shown).map((w,i)=>`<div class="card"${w.u?` data-v="${esc(w.u)}" data-n="${esc(w.n)}" tabindex="0" role="button" aria-label="Play ${esc(w.n)}"`:""}><div class="th ${w.r=="16:9"?"wd":""}" style="--a:${G[i%6][0]};--b:${G[i%6][1]}">${w.i?`<img src="${esc(w.i)}" alt="">`:""}<span class="p">▶</span><span class="t">${esc(w.t)}</span></div><h3>${esc(w.n)}</h3><p>${esc(w.d)}</p></div>`).join("")}</div>
${list.length>shown?`<div class="more"><button class="btn o" id="more">Load more videos ↓</button></div>`:""}</div></section>
<section id="spec"><div class="w"><div class="k">( 03 ) Specializations</div><h2>One creative partner. Every <em>format.</em></h2><div class="sg">
${[["AI Drama","Cinematic story ads with consistent characters, scenes and an emotional hook."],["AI UGC","Creator-style ads with photorealistic people and natural delivery."],["VSL","Direct-response video sales letters that hook fast and drive the click."],["Podcast","Conversational ads with AI voices, expressive performance and lip sync."],["AI Song","Branded songs and jingles performed by AI characters, edited to the beat."],["Animations","Animated product creatives and mascots that stand out in the feed."]].map((x,i)=>`<div><b>0${i+1}</b><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div></div></section>
<section><div class="w"><div class="k">( 04 ) Core expertise</div><h2>From prompt to <em>final edit.</em></h2><div class="ex">
<div><div class="k">A</div><h3>AI content creation</h3><ul><li>Prompt engineering</li><li>AI image and video generation</li><li>AI voice and lip sync</li><li>Character and scene consistency</li></ul></div>
<div><div class="k">B</div><h3>Commercial creative</h3><ul><li>Direct-response video ads</li><li>AI product visualization</li><li>Visual storytelling</li><li>Creative direction</li></ul></div>
<div><div class="k">C</div><h3>Production workflow</h3><ul><li>Script breakdown and storyboarding</li><li>Image-to-video workflows</li><li>Editing, sound and captions</li><li>Hook variations and iteration</li></ul></div></div></div></section>
<section id="tools"><div class="w"><div class="k">( 05 ) Tool stack</div><h2>The tools behind the <em>work.</em></h2><div class="tools">${S.tools.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div></section>
<section id="process"><div class="w"><div class="k">( 06 ) Process</div><h2>A clear path from brief to <em>delivery.</em></h2><ol>
<li><h3>Break down the script</h3><p>Your brief becomes scenes, shots, hooks and camera direction.</p></li>
<li><h3>Build the references</h3><p>Characters, wardrobe, product and locations locked in for consistency.</p></li>
<li><h3>Generate and edit</h3><p>Video generation, voice, lip sync, then editing with sound and captions.</p></li>
<li><h3>Hooks and revisions</h3><p>Alternate hooks and changes based on your feedback and results.</p></li></ol></div></section>
<section id="contact"><div class="w"><div class="k">( 07 ) Contact</div><h2>Got a product? I’ll bring the <em>views.</em></h2>
${rows.map(r=>r[2]?`<a class="cr" href="${esc(r[2])}" target="_blank" rel="noopener">${r[0]}<span>${esc(r[1])} ↗</span></a>`:`<div class="cr">${r[0]}<span>${esc(r[1])}</span></div>`).join("")}</div></section></main>
<footer><div class="w"><span>© 2026 ${esc(P.name)} · ${esc(P.role)}</span><a href="#top">Back to top ↑</a></div></footer>`;
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(c){cur=c.dataset.c;shown=8;site();}if(e.target.id=="more"){shown+=8;site();}});
const F=[["name","Name"],["role","Role / title"],["status","Availability line (small text above the headline)"],["headline","Headline (wrap one word in *stars* to color it)"],["intro","Intro text","t"],["about","About paragraph","t"],["email","Email"],["whatsapp","WhatsApp link (https://wa.me/…)"],["discord","Discord username"],["folder","Link to all videos (Drive folder)"],["location","Based in"]];
function drawer(){
const P=S.p;
$("#dr").innerHTML=`<div class="bar"><button class="btn sm" id="sv">Save and publish</button><button class="btn o sm" id="cl">Close</button><span id="msg"></span></div>
<h4>TEMPLATE</h4><select data-theme><option value="pop"${(S.theme||"pop")=="pop"?" selected":""}>Pop (colorful, bold)</option><option value="classic"${S.theme=="classic"?" selected":""}>Classic (dark, editorial)</option><option value="block"${S.theme=="block"?" selected":""}>Block (light, playful)</option><option value="cinema"${S.theme=="cinema"?" selected":""}>Cinema (film, gold)</option></select><h4>PROFILE</h4>${F.map(f=>`<label>${f[1]}</label>${f[2]?`<textarea data-p="${f[0]}">${esc(P[f[0]])}</textarea>`:`<input data-p="${f[0]}" value="${esc(P[f[0]])}">`}`).join("")}
<label>Profile photo</label><input type="file" accept="image/*" id="ph">
<h4>NUMBERS (leave blank to hide)</h4>${S.s.map((s,i)=>`<div class="it"><input data-s="${i}.0" placeholder="e.g. 3M+" value="${esc(s[0])}"><div class="r"><input data-s="${i}.1" placeholder="Label, e.g. views on one ad" value="${esc(s[1])}"></div></div>`).join("")}
<h4>TOOLS (comma separated)</h4><textarea data-tools>${esc(S.tools.join(", "))}</textarea>
<h4>VIDEOS</h4>${S.w.map((w,i)=>`<div class="it" data-i="${i}"><input data-w="n" placeholder="Title" value="${esc(w.n)}"><div class="r"><select data-w="t">${TY.map(t=>`<option${t==w.t?" selected":""}>${t}</option>`).join("")}</select><select data-w="r"><option${w.r=="9:16"?" selected":""}>9:16</option><option${w.r=="16:9"?" selected":""}>16:9</option></select></div>
<input style="margin-top:8px" data-w="d" placeholder="One-line description" value="${esc(w.d)}"><input style="margin-top:8px" data-w="u" placeholder="Video link (Drive, YouTube…)" value="${esc(w.u)}">
<div class="r"><input type="file" accept="image/*" data-th="${i}"><button class="btn o sm" data-del="${i}">Remove</button></div></div>`).join("")}
<button class="btn o sm" id="add">+ Add video</button>`;
}
$("#dr").addEventListener("input",e=>{const t=e.target;dirty=true;
if(t.dataset.p)S.p[t.dataset.p]=t.value;
else if(t.dataset.s){const[a,b]=t.dataset.s.split(".");S.s[a][b]=t.value;}
else if("theme" in t.dataset)S.theme=t.value;
else if("tools" in t.dataset)S.tools=t.value.split(",").map(x=>x.trim()).filter(Boolean);
else if(t.dataset.w){const w=S.w[t.closest("[data-i]").dataset.i];w[t.dataset.w]=t.value;}
site();});
$("#dr").addEventListener("change",async e=>{const t=e.target;if(t.type!="file"||!t.files[0])return;
if(!assets){msg("Uploads are not available here.");return;}
try{msg("Uploading…");const r=await assets.upload(t.files[0]);
if(t.id=="ph")S.photo=r.url;else S.w[t.dataset.th].i=r.url;dirty=true;msg("Uploaded. Now Save.");site();}catch(x){msg("Upload failed.");}});
$("#dr").addEventListener("click",e=>{const t=e.target;
if(t.id=="cl")$("#dr").classList.remove("on");
if(t.id=="add"){S.w.push({n:"New video",t:"AI Drama",r:"9:16",d:"",u:"",i:""});dirty=true;drawer();site();}
if(t.dataset.del){S.w.splice(+t.dataset.del,1);dirty=true;drawer();site();}
if(t.id=="sv")save();});
function msg(m){const x=$("#msg");if(x)x.textContent=m;}
function build(){
const j=JSON.stringify(S).replace(/</g,"\\u003c"),e="<"+"/script>";
return `<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<meta name="theme-color" content="#111111">\n<title>${esc(S.p.name)} · ${esc(S.p.role)}</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&family=Bebas+Neue&display=swap">\n<style id="css">${$("#css").textContent}</style></head>\n<body><div id="site"></div><button id="eb" class="btn" hidden>Edit page</button><aside id="dr" aria-label="Page editor"></aside>\n<script id="state" type="application/json">${j}${e}\n<script id="app">${$("#app").textContent}${e}\n</body></html>`;}
async function save(){try{msg("Saving…");await art.publish(build());}catch(x){msg(x&&x.code=="conflict"?"Page changed elsewhere. Reload and retry.":"Could not save.");}}
function emb(u){let m;
if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))||(m=u.match(/drive\.google\.com\/open\?id=([\w-]+)/)))return{t:"f",s:"https://drive.google.com/file/d/"+m[1]+"/preview"};
if(m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/))return{t:"f",s:"https://www.youtube.com/embed/"+m[1]+"?autoplay=1"};
if(u.indexOf("/_blob/")==0||/\.(mp4|webm|mov)(\?|$)/i.test(u))return{t:"v",s:u};
return null;}
document.body.insertAdjacentHTML("beforeend",'<div id="md" role="dialog" aria-modal="true" aria-label="Video player"><div class="mb"><div class="mh"><span id="mt"></span><button id="mx">Close ✕</button></div><div id="mf"></div><div class="mo">Not playing? <a id="ml" target="_blank" rel="noopener">Open in a new tab ↗</a></div></div></div>');
function openV(u,n){const e=emb(u);if(!e){window.open(u,"_blank","noopener");return;}
$("#mt").textContent=n||"Video";$("#ml").href=u;
$("#mf").innerHTML=e.t=="v"?`<video src="${esc(e.s)}" controls autoplay playsinline></video>`:`<iframe src="${esc(e.s)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
$("#md").classList.add("on");}
function closeV(){$("#md").classList.remove("on");$("#mf").innerHTML="";}
document.addEventListener("click",e=>{const c=e.target.closest(".card[data-v]");if(c){openV(c.dataset.v,c.dataset.n);return;}
if(e.target.id=="mx"||e.target.id=="md")closeV();});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeV();
if(e.key=="Enter"&&e.target.matches&&e.target.matches(".card[data-v]"))openV(e.target.dataset.v,e.target.dataset.n);});

site();
if(window.claude){
Promise.all([claude.use("user"),claude.use("artifact"),claude.use("assets")]).then(([u,a,s])=>{
art=a;assets=s;
if(u&&u.canEdit()&&a){const b=$("#eb");b.hidden=false;b.onclick=()=>{drawer();$("#dr").classList.add("on");};}
}).catch(()=>{});}
</script>
</body></html>
